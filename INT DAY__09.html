 <!-- Task 1: Create an Interactive Webpage -->


<!DOCTYPE html>
<html lang="en">
<head>
    <title>Interactive Webpage</title>
</head>
<body>

    <h1>Student Portal</h1>

    <p id="message">Welcome Student!</p>

    <button id="myButton">Click Me</button>

    <hr>

    <!-- Task 2: Form Submission Event -->
    <h2>Student Registration</h2>

    <form id="studentForm">
        <label>Student Name:</label>
        <input type="text" id="studentName" required>
        <button type="submit">Submit</button>
    </form>

    <p id="result"></p>

    <hr>
    
    
<!-- Task 3: Display Dynamic Data -->

<h2>Student Details</h2>

<button id="showDetails">Show Student Details</button>

<p id="details"></p>

<hr>

<!-- Task 4 — Array Filtering and Searching -->
<h2>Search Students</h2>

<input type="text" id="searchName" placeholder="Enter student name">

<button id="searchBtn">Search</button>

<button id="showAllBtn">Show All Students</button>

<p id="studentList"></p>

<hr>

<!-- Task 5 — Asynchronous Operations and API Responses -->

<h2>API Data</h2>

<button id="loadData">Load API Data</button>

<p id="apiResult">Click to load data.</p>

    <script src="INT DAY__09.js"></script>
    
</body>
</html>
